[package]
name = "litho-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core geometry, image processing, manifold boolean, and export engine for Lithophane Studio."

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
manifold-rust = { version = "0.19", features = ["parallel"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

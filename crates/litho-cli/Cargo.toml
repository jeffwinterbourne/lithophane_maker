[package]
name = "litho-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fast CLI for Lithophane Studio."

[[bin]]
name = "litho"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
litho-core = { path = "../litho-core" }
serde_json = "1"
